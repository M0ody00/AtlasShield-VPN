name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AtlasShield-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Run Android lint
        run: gradle --no-daemon --stacktrace --console=plain :app:lintDebug
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AtlasShield-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
